<aside class="sidebar">

        <svg width="24" height="24" viewBox="0 0 24 24" fill="white">
            <path d="M6 3h12a1 1 0 0 1 1 1v17.382a1 1 0 0 1-1.553.833L12 19.118l-5.447 3.097A1 1 0 0 1 5 21.382V4a1 1 0 0 1 1-1z" />
        </svg>
        <span>Mi Bolsillo</span>

            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

                <path d="M3 10h18" />
            </svg>
            <span>Cuentas</span>
        </a>
        <a href="{% url 'categorias_list' %}" class="nav-item {% if current == 'categorias' %}active{% endif %}">

            </svg>
            <span>Movimientos</span>
        </a>
        <a href="{% url 'subir_cartola' %}" class="nav-item {% if current == 'subir' %}active{% endif %}">

            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <polyline points="16 17 21 12 16 7" />
                <line x1="21" y1="12" x2="9" y2="12" />
